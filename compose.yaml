services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: roman
      POSTGRES_PASSWORD: iamdamngood
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "roman", "-d", "parking"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
