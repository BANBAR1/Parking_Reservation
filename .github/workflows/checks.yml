name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.6
        env:
          POSTGRES_USER: roman
          POSTGRES_PASSWORD: iamdamngood
          POSTGRES_DB: parking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roman -d parking"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - run: make install
      - run: make check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
